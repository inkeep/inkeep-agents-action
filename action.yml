name: 'Inkeep Agents Trigger'
description: 'Trigger Inkeep agents from GitHub events with rich PR context (diffs, files, comments)'
author: 'Inkeep'

branding:
  icon: 'zap'
  color: 'purple'

inputs:
  trigger-url:
    description: 'The Inkeep agent trigger webhook URL'
    required: true
  signing-secret:
    description: 'HMAC signing secret for payload verification (optional)'
    required: false
  github-token:
    description: 'Override GitHub token. If provided, skips OIDC authentication flow'
    required: false
  path-filter:
    description: 'Glob pattern to filter which changed files trigger the action (e.g., "docs/**")'
    required: false
  pr-title-regex:
    description: 'Regex to filter which PR titles trigger the action (e.g., "^\\[docs\\]")'
    required: false
  api-base-url:
    description: 'Override Inkeep API base URL (for testing only, e.g., "https://your-ngrok-url.ngrok.io")'
    required: false

outputs:
  invocation-id:
    description: 'The trigger invocation ID from the Inkeep API'
  conversation-id:
    description: 'The conversation ID created by the agent'
  skipped:
    description: 'Set to "true" when the action exited without triggering the agent'
  skip-reason:
    description: 'Why the trigger was skipped: insufficient-permission, bot-pr-exists, no-matching-files, title-no-match, or inkeep-bot-comment'
  existing-bot-pr-number:
    description: 'Number of the existing bot PR, when skip-reason is bot-pr-exists'
  existing-bot-pr-url:
    description: 'URL of the existing bot PR, when skip-reason is bot-pr-exists'

runs:
  using: 'node20'
  main: 'dist/index.js'
